<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Groq Text to Speech</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .box {
        background: white;
        width: 90%;
        max-width: 600px;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 10px 30px #0002;
    }

    h1 {
        margin-top: 0;
    }

    textarea {
        width: 100%;
        height: 150px;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        resize: vertical;
    }

    select,
    button {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    button {
        background: #111;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.6;
    }

    #status {
        margin-top: 15px;
    }

    audio {
        width: 100%;
        margin-top: 15px;
    }
</style>
</head>

<body>

<div class="box">

    <h1>Groq Text to Speech</h1>

    <textarea
        id="text"
        maxlength="200"
        placeholder="Enter text here..."
    ></textarea>

    <select id="voice">
        <option value="troy">Troy</option>
        <option value="hannah">Hannah</option>
        <option value="autumn">Autumn</option>
        <option value="diana">Diana</option>
        <option value="austin">Austin</option>
        <option value="daniel">Daniel</option>
    </select>

    <button id="generate">Generate Speech</button>

    <div id="status"></div>

    <audio id="audio" controls></audio>

</div>

<script>

const GROQ_API_KEY = "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";

const textBox = document.getElementById("text");
const voiceBox = document.getElementById("voice");
const button = document.getElementById("generate");
const status = document.getElementById("status");
const audio = document.getElementById("audio");

button.onclick = async () => {

    const text = textBox.value.trim();
    const voice = voiceBox.value;

    if (!text) {
        status.textContent = "Please enter some text.";
        return;
    }

    if (text.length > 200) {
        status.textContent = "Maximum 200 characters.";
        return;
    }

    if (
        !GROQ_API_KEY ||
        GROQ_API_KEY === "YOUR_GROQ_API_KEY"
    ) {
        status.textContent = "Please add your Groq API key.";
        return;
    }

    button.disabled = true;
    status.textContent = "Generating speech...";

    try {

        const response = await fetch(
            "https://api.groq.com/openai/v1/audio/speech",
            {
                method: "POST",

                headers: {
                    "Authorization": "Bearer " + GROQ_API_KEY,
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    model: "canopylabs/orpheus-v1-english",
                    input: text,
                    voice: voice,
                    response_format: "wav"
                })
            }
        );

        if (!response.ok) {

            const error = await response.text();

            throw new Error(error);
        }

        const blob = await response.blob();

        const url = URL.createObjectURL(blob);

        audio.src = url;

        await audio.play();

        status.textContent = "Speech generated successfully!";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Error: " + error.message;

    } finally {

        button.disabled = false;

    }
};

</script>

</body>
</html>
